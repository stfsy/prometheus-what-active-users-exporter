name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Setup Node.js (LTS)
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Build and upload release binaries (Node 22 LTS)
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          RELEASE_NAME="${{ github.event.repository.name }}-${{ steps.release.outputs.tag_name }}"
          npx @yao-pkg/pkg --compress GZip --targets node22-linux-x64,node22-alpine-x64,node22-linuxstatic-x64 lib/index.js
          mv index-alpine "${RELEASE_NAME}-alpine-x64"
          mv index-linux "${RELEASE_NAME}-linux-x64"
          mv index-linuxstatic "${RELEASE_NAME}-linuxstatic-x64"
          sha256sum "${RELEASE_NAME}-alpine-x64" >> sha256sums.txt
          sha256sum "${RELEASE_NAME}-linux-x64" >> sha256sums.txt
          sha256sum "${RELEASE_NAME}-linuxstatic-x64" >> sha256sums.txt
          gh release upload "${{ steps.release.outputs.tag_name }}" \
            sha256sums.txt \
            "${RELEASE_NAME}-alpine-x64" \
            "${RELEASE_NAME}-linux-x64" \
            "${RELEASE_NAME}-linuxstatic-x64" \
            --clobber
